<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" role="img" aria-label="A cute round robot with an antenna holding a checklist">
  <!-- antenna -->
  <line x1="140" y1="44" x2="140" y2="20" stroke="#5a6b7a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="140" cy="16" r="10" fill="#ffd166"/>
  <circle cx="137" cy="13" r="3" fill="#fff" opacity="0.9"/>
  <!-- head: one big rounded blob -->
  <rect x="52" y="40" width="176" height="150" rx="66" fill="#4da3ff"/>
  <!-- face plate -->
  <rect x="76" y="66" width="128" height="96" rx="44" fill="#eef6ff"/>
  <!-- big eyes with highlights -->
  <circle cx="116" cy="112" r="17" fill="#1c1e21"/>
  <circle cx="164" cy="112" r="17" fill="#1c1e21"/>
  <circle cx="122" cy="105" r="6" fill="#fff"/>
  <circle cx="170" cy="105" r="6" fill="#fff"/>
  <!-- happy mouth -->
  <path d="M124 138 q16 14 32 0" stroke="#1c1e21" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="94" cy="134" rx="9" ry="5.5" fill="#f7a8a0" opacity="0.8"/>
  <ellipse cx="186" cy="134" rx="9" ry="5.5" fill="#f7a8a0" opacity="0.8"/>
  <!-- side ears -->
  <rect x="40" y="96" width="16" height="38" rx="8" fill="#2f6fbe"/>
  <rect x="224" y="96" width="16" height="38" rx="8" fill="#2f6fbe"/>
  <!-- body: small under the big head -->
  <rect x="88" y="186" width="104" height="76" rx="30" fill="#4da3ff"/>
  <circle cx="140" cy="220" r="16" fill="#eef6ff"/>
  <path d="M133 220 l5 6 10 -11" stroke="#2f9e63" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- feet -->
  <ellipse cx="114" cy="272" rx="20" ry="12" fill="#2f6fbe"/>
  <ellipse cx="166" cy="272" rx="20" ry="12" fill="#2f6fbe"/>
  <!-- arms: one waves, one holds a checklist -->
  <rect x="62" y="196" width="18" height="44" rx="9" fill="#2f6fbe" transform="rotate(26 71 218)"/>
  <rect x="200" y="196" width="18" height="44" rx="9" fill="#2f6fbe" transform="rotate(-26 209 218)"/>
  <g transform="rotate(-8 236 236)">
    <rect x="216" y="210" width="40" height="50" rx="6" fill="#fff" stroke="#26343f" stroke-width="4"/>
    <rect x="228" y="204" width="16" height="10" rx="3" fill="#26343f"/>
    <path d="M224 228 l4 5 8 -9" stroke="#2f9e63" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M224 244 l4 5 8 -9" stroke="#2f9e63" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
