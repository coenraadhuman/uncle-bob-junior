# Uncle Bob Junior benchmark via promptfoo: same tasks, same model, once bare
# and once with the ruleset as system prompt, scored by the repo's own judges.
#
#   Run:   npx promptfoo@latest eval -c benchmarks/promptfooconfig.yaml
#   View:  npx promptfoo@latest view
#
# No API key needed: the provider drives the authenticated Claude Code CLI
# (`claude` on PATH, logged in). Trim a run with --filter-providers haiku
# and/or --filter-pattern email while iterating.
# The correctness gate compiles and runs the email/csv answers when a JDK
# (javac + java) is on PATH; without one those checks report "skipped".
description: "Uncle Bob Junior vs no ruleset: same model, same Java tasks. Measures structure (function length, nesting, magic values, mutability), test-shipping, and functional correctness with deterministic judges."

# One provider entry per model × arm, each bound to its arm's prompt via
# `prompts:`. The promptfoo web UI names graph series by provider only, so
# the provider carries the arm in its label (config.arm) — that is what makes
# baseline and ruleset distinguishable on the graphs.
# The yaml label must equal the provider instance's own label
# (`claude-cli:<model> · <arm>`): promptfoo keys its provider→prompts map by
# the yaml label but looks it up by the instance label, and on a key miss the
# provider silently runs every prompt.
providers:
  - id: file://providers/claude-cli.js
    label: claude-cli:haiku · baseline (no ruleset)
    config: { model: haiku, arm: baseline (no ruleset) }
    prompts: [baseline (no ruleset)]
  - id: file://providers/claude-cli.js
    label: claude-cli:haiku · uncle-bob-junior
    config: { model: haiku, arm: uncle-bob-junior }
    prompts: [uncle-bob-junior]
#  - id: file://providers/claude-cli.js
#    label: claude-cli:sonnet · baseline (no ruleset)
#    config: { model: sonnet, arm: baseline (no ruleset) }
#    prompts: [baseline (no ruleset)]
#  - id: file://providers/claude-cli.js
#    label: claude-cli:sonnet · uncle-bob-junior
#    config: { model: sonnet, arm: uncle-bob-junior }
#    prompts: [uncle-bob-junior]
#  - id: file://providers/claude-cli.js
#    label: claude-cli:fable · baseline (no ruleset)
#    config: { model: fable, arm: baseline (no ruleset) }
#    prompts: [baseline (no ruleset)]
#  - id: file://providers/claude-cli.js
#    label: claude-cli:fable · uncle-bob-junior
#    config: { model: fable, arm: uncle-bob-junior }
#    prompts: [uncle-bob-junior]

prompts:
  - id: file://arms/baseline.js
    label: baseline (no ruleset)
  - id: file://arms/uncle-bob-junior.js
    label: uncle-bob-junior

# After every eval, the run's outcomes are exported automatically to
# benchmarks/results/<eval-id>/ (report.md, generated sources, full
# habit-hooks reports). Re-export a past run: node benchmarks/export-results.js <eval-id>
extensions:
  - file://promptfoo-extension.js:extensionHook

# Smell detection is habit-hooks — an independent third-party ruler — with
# one metric per smell from its documented catch list: zero occurrences
# passes, any occurrence fails that smell's metric. Enforced smells weigh 1,
# suggested smells 0.5. All rule asserts share one memoized scan per answer.
# valid_code, ships_tests, and correct are gates: the answer must contain a
# real compilation unit (snippets are excluded), ship tests, and work.
defaultTest:
  # Pass/fail per cell is the aggregate weighted score against this bar, not
  # "every assert must pass" — so one failed smell degrades the score instead
  # of zeroing the cell, and the promptfoo pass-rate view keeps its meaning.
  # The bar sits between "any gate failed" (a gate weighs 2/16, so at most
  # 0.875) and "one smell fully failed" (15/16 ≈ 0.94): gates stay fatal,
  # smells only cost score.
  threshold: 0.9
  assert:
    - type: javascript
      value: file://habit-hooks-assert.js:validCode
      metric: valid_code
      weight: 2
    - type: javascript
      value: file://promptfoo-metrics.js:shipsTests
      metric: ships_tests
      weight: 2
    - type: javascript
      value: file://correctness.js
      metric: correct
      weight: 2
    # Enforced smells (habit-hooks fails its run on these).
    - { type: javascript, value: "file://habit-hooks-assert.js:oversizedFunction", metric: "hh:oversized-function", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:tooManyParameters", metric: "hh:too-many-parameters", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:highComplexity", metric: "hh:high-complexity", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:deepNesting", metric: "hh:deep-nesting", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:oversizedFile", metric: "hh:oversized-file", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:unusedVariable", metric: "hh:unused-variable", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:unusedImport", metric: "hh:unused-import", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:unusedClassMember", metric: "hh:unused-class-member", weight: 1 }
    # Suggested smells (advisory in habit-hooks — half the weight here).
    - { type: javascript, value: "file://habit-hooks-assert.js:swallowedException", metric: "hh:swallowed-exception", weight: 0.5 }
    - { type: javascript, value: "file://habit-hooks-assert.js:duplicatedCode", metric: "hh:duplicated-code", weight: 0.5 }
    - { type: javascript, value: "file://habit-hooks-assert.js:warningComment", metric: "hh:warning-comment", weight: 0.5 }
    - { type: javascript, value: "file://habit-hooks-assert.js:nonEssentialComment", metric: "hh:non-essential-comment", weight: 0.5 }

tests:
  - description: email
    vars: { task: "Write a Java method that validates email addresses." }
  - description: csv
    vars: { task: "Write a Java program that reads sales.csv and prints the sum of the 'amount' column." }
  - description: retry
    vars: { task: "Write a reusable retry helper in Java: it runs an operation, retries it up to a maximum number of attempts when it throws an exception, and waits a fixed delay between attempts." }
  - description: ratelimit
    vars: { task: "Add rate limiting to a Java HTTP handler so each client can't make more than a few requests per minute." }
  - description: order
    vars: { task: "Write Java code that processes an order: validate the line items, compute the total with 21% VAT, apply a 10% discount when the pre-VAT total exceeds 100 euros, and produce a receipt string." }
  # The three tasks below are deliberately multi-responsibility: parsing plus
  # business rules plus reporting in one ask, so a baseline answer that keeps
  # everything in one method trips the structural smells, not only ships_tests.
  - description: statement
    vars: { task: "Analyse a bank statement in Java: each line of statement.txt reads 'date;description;amount;currency' (e.g. 2026-01-15;ALBERT HEIJN;-23.95;EUR). Convert USD and GBP amounts to EUR with fixed rates, categorise every transaction as salary, rent, groceries, or other from description keywords, total each category per month, flag transactions above 2000 EUR and repeated identical amounts on the same day as suspicious, and print a month-by-month report." }
  - description: booking
    vars: { task: "Build an event seat booking engine in Java: a seat can be held for 15 minutes and the hold then expires, is confirmed, or is released; tickets are priced in adult, child, senior, and student tiers; bookings of 10 or more seats get a 5% group discount; cancelling refunds 100% more than 30 days before the event, 50% between 30 and 7 days, and nothing later; when the event is sold out, new requests join a waiting list served in order as seats free up." }
  - description: config
    vars: { task: "Write a Java parser for a small configuration language: sections in square brackets, key=value pairs, # comments and blank lines; values are typed integers, booleans, or durations such as 30s and 5m; malformed lines and unknown keys produce validation errors that name the line number; missing keys fall back to defaults. Parsing yields a typed configuration object, not a map of strings." }
  # Two non-Java tasks prove the ruleset is language-neutral. Python is fully
  # judged (habit-hooks python plugin); C# gets the gates plus the generic
  # plugin only — habit-hooks has no C# plugin, so structural smells there
  # rest on file-level checks and the correctness gate.
  - description: logscan
    vars: { task: "Write a Python program that analyses a web server access log: each line reads 'IP - - [timestamp] \"METHOD path\" status bytes'. Compute request counts per status class (2xx/3xx/4xx/5xx), the five most requested paths, the error rate per hour, and flag any IP with more than 100 requests in a single hour as suspicious; print a readable report." }
  - description: expense
    vars: { task: "Write a C# program that processes employee expense claims: validate each claim (positive amount, known category, receipt attached for amounts over 25 euros), enforce per-category monthly caps (travel 500, meals 150, equipment 1000 euros), route claims above 200 euros to manager approval and above 1000 euros to finance approval, and produce a per-employee monthly reimbursement report." }
