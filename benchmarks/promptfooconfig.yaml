# Uncle Bob Junior benchmark via promptfoo: same tasks, same model, once bare
# and once with the ruleset as system prompt, scored by the repo's own judges.
#
#   Run:   npx promptfoo@latest eval -c benchmarks/promptfooconfig.yaml
#   View:  npx promptfoo@latest view
#
# No API key needed: the provider drives the authenticated Claude Code CLI
# (`claude` on PATH, logged in). Trim a run with --filter-providers haiku
# and/or --filter-pattern email while iterating.
# The correctness gate compiles and runs the email/csv answers when a JDK
# (javac + java) is on PATH; without one those checks report "skipped".
description: "Uncle Bob Junior vs no ruleset: same model, same Java tasks. Measures structure (function length, nesting, magic values, mutability), test-shipping, and functional correctness with deterministic judges."

providers:
  - id: file://providers/claude-cli.js
    label: haiku
    config: { model: haiku }
#  - id: file://providers/claude-cli.js
#    label: sonnet
#    config: { model: sonnet }
#  - id: file://providers/claude-cli.js
#    label: fable
#    config: { model: fable }

prompts:
  - id: file://arms/baseline.js
    label: baseline (no ruleset)
  - id: file://arms/uncle-bob-junior.js
    label: uncle-bob-junior

# After every eval, the run's outcomes are exported automatically to
# benchmarks/results/<eval-id>/ (report.md, generated sources, full
# habit-hooks reports). Re-export a past run: node benchmarks/export-results.js <eval-id>
extensions:
  - file://promptfoo-extension.js:extensionHook

# Smell detection is habit-hooks — an independent third-party ruler — with
# one metric per smell from its documented catch list: zero occurrences
# passes, any occurrence fails that smell's metric. Enforced smells weigh 1,
# suggested smells 0.5. All rule asserts share one memoized scan per answer.
# valid_code, ships_tests, and correct are gates: the answer must contain a
# real compilation unit (snippets are excluded), ship tests, and work.
defaultTest:
  assert:
    - type: javascript
      value: file://habit-hooks-assert.js:validCode
      metric: valid_code
      weight: 2
    - type: javascript
      value: file://promptfoo-metrics.js:shipsTests
      metric: ships_tests
      weight: 2
    - type: javascript
      value: file://correctness.js
      metric: correct
      weight: 2
    # Enforced smells (habit-hooks fails its run on these).
    - { type: javascript, value: "file://habit-hooks-assert.js:oversizedFunction", metric: "hh:oversized-function", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:tooManyParameters", metric: "hh:too-many-parameters", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:highComplexity", metric: "hh:high-complexity", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:deepNesting", metric: "hh:deep-nesting", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:oversizedFile", metric: "hh:oversized-file", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:unusedVariable", metric: "hh:unused-variable", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:unusedImport", metric: "hh:unused-import", weight: 1 }
    - { type: javascript, value: "file://habit-hooks-assert.js:unusedClassMember", metric: "hh:unused-class-member", weight: 1 }
    # Suggested smells (advisory in habit-hooks — half the weight here).
    - { type: javascript, value: "file://habit-hooks-assert.js:swallowedException", metric: "hh:swallowed-exception", weight: 0.5 }
    - { type: javascript, value: "file://habit-hooks-assert.js:duplicatedCode", metric: "hh:duplicated-code", weight: 0.5 }
    - { type: javascript, value: "file://habit-hooks-assert.js:warningComment", metric: "hh:warning-comment", weight: 0.5 }
    - { type: javascript, value: "file://habit-hooks-assert.js:nonEssentialComment", metric: "hh:non-essential-comment", weight: 0.5 }

tests:
  - description: email
    vars: { task: "Write a Java method that validates email addresses." }
  - description: csv
    vars: { task: "Write a Java program that reads sales.csv and prints the sum of the 'amount' column." }
  - description: retry
    vars: { task: "Write a reusable retry helper in Java: it runs an operation, retries it up to a maximum number of attempts when it throws an exception, and waits a fixed delay between attempts." }
  - description: ratelimit
    vars: { task: "Add rate limiting to a Java HTTP handler so each client can't make more than a few requests per minute." }
  - description: order
    vars: { task: "Write Java code that processes an order: validate the line items, compute the total with 21% VAT, apply a 10% discount when the pre-VAT total exceeds 100 euros, and produce a receipt string." }
